# Render Blueprint for Tenth: one Node web service + one managed PostgreSQL database.
# Deploy: Render Dashboard -> New -> Blueprint -> select this repository.
# After the first deploy, open /setup on your service URL (or run `npm run owner:create`) to create the owner account.
services:
  - type: web
    name: tenth
    runtime: node
    plan: starter            # any paid plan avoids cold starts; "free" also works but sleeps when idle
    region: oregon           # keep the web service and database in the same region
    buildCommand: npm ci --include=dev && npm run build   # build tools (TypeScript, Tailwind) are devDependencies
    # Migrations run before the server starts (safe to repeat; guarded by an advisory lock).
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: tenth-db
          property: connectionString   # internal (private network) URL, without TLS (see README: Database connection)
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: OWNER_EMAIL
        sync: false                    # you are prompted for this during Blueprint setup
      - key: OWNER_SETUP_TOKEN
        generateValue: true            # copy it from the dashboard to use the one-time /setup page
      # BETTER_AUTH_URL defaults to Render's RENDER_EXTERNAL_URL. Set it explicitly (https://) if you add a custom
      # domain; the onrender.com address stays trusted automatically.

databases:
  - name: tenth-db
    databaseName: tenth
    user: tenth_app
    plan: basic-256mb        # paid plans include backups / point-in-time recovery; free databases expire
    postgresMajorVersion: "16"
    ipAllowList: []          # no public access; only services in your Render account can connect (pg_dump: see README)
